name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Gradle (no wrapper jar is committed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Fetch Ruffle (MIT OR Apache-2.0)
        run: bash scripts/fetch_ruffle.sh

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fire-and-Water-Mobile-Duo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
